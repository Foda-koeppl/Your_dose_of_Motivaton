<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>School Motivation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>School Motivation</h1>
        <p>Feed your mind. Grow your future.</p>
    </header>

    <section>
        <img src="https://images.unsplash.com/photo-1508558936510-0af1e3cccbab?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Studying student">
        <button onclick="generateQuote()">Get Motivated</button>
        <p id="quote"></p>
    </section>

    <footer>
        <a href="Mainpage.html">Back to Home</a>
    </footer>

    <script>
    const quotes = [
            "Every expert was once a beginner.",
            "Education is the passport to the future.",
            "Dream big. Work hard. Stay focused.",
            "You don't have to be perfect, just consistent."
        ];

        function generateQuote() {
            const random = Math.floor(Math.random() * quotes.length);
            document.getElementById("quote").innerText = quotes[random];
        }</script>
</body>
</html>
